<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ABACUS360 · 360 Practice demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: a shipped product, calm and exact, the way a chartered firm works.
   IDEA: the 360 Practice app itself, running a sample firm, with a guided tour.
   PICTURE: the live screens: radar, client ring, VAT job, forensic case.
   COLOUR and TYPE: ABACUS360 navy #182750 and royal blue #133ABE on white, status colours, a thread of gold; Roboto.
   LAYOUT: app shell, sidebar on desktop, top scroller on phones, tour card bottom right. */
:root{color-scheme:light;--navy:#182750;--blue:#133ABE;--bl:#E8EDFB;--ink:#1d2230;--tx:#33373D;--mut:#6b7280;--line:#E3E6EE;--bg:#F4F5F9;--card:#fff;
--ok:#1E8E5A;--okl:#E3F4EC;--rev:#133ABE;--revl:#E6ECFC;--wait:#B26F06;--waitl:#FCF1DE;--risk:#C8372D;--riskl:#FBE6E4;--na:#EEF0F4;--gold:#B8933E;--goldl:#F4ECDA}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--navy);color:#cfd6ea;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.wm{color:#fff;font-weight:300;letter-spacing:2.5px;font-size:17px}
.sub{font-size:10px;letter-spacing:1.6px;color:#9fb0dc;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;border-radius:8px;border:0;background:none;color:#cfd6ea;text-align:left;font-size:14px;min-height:42px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:500}
.nav .b{background:#2c4385;color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.nav .b.g{background:var(--gold);color:#1d1a12}
.nav .sec{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7f90bf;margin:14px 11px 4px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.1)}
.av{width:34px;height:34px;border-radius:50%;background:#2c4385;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.main{flex:1;display:flex;flex-direction:column}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:5}
.search{flex:1;max-width:440px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:#8a90a0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .r{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--mut);font-size:13px;white-space:nowrap}
.tourbtn{border:1px solid var(--gold);background:var(--goldl);color:#6b531b;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;min-height:36px}
.content{padding:22px 24px 90px;max-width:1360px;width:100%}
h1{font-size:23px;font-weight:500;color:var(--ink);margin:0;line-height:1.2}
h2{font-size:15px;font-weight:500;color:var(--ink);margin:0}
.subt{color:var(--mut);font-size:13.5px;margin-top:4px}
.row{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card>.hd small{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,340px)}
.g2b{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi .l{font-size:12.5px;color:var(--mut)}.kpi .v{font-size:clamp(22px,2.4vw,28px);font-weight:500;color:var(--ink);margin-top:4px;white-space:nowrap}.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.v.g{color:var(--ok)}.v.r{color:var(--risk)}.v.b{color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:500;background:var(--blue);color:#fff;border:1px solid var(--blue);min-height:40px}
.btn.o{background:#fff;color:var(--blue);border-color:#c9d3f3}
.btn.gd{background:var(--gold);border-color:var(--gold);color:#1d1a12}
.btn.red{background:#fff;color:var(--risk);border-color:#f1c4bf}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:var(--okl);color:var(--ok)}.rev{background:var(--revl);color:var(--rev)}.wait{background:var(--waitl);color:var(--wait)}.risk{background:var(--riskl);color:var(--risk)}.na{background:var(--na);color:#5d6475}.ai{background:var(--goldl);color:#7a5c17}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #F0F2F6;font-size:13.5px;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.radar td{text-align:center;padding:6px 4px}.radar th{text-align:center}.radar td:first-child,.radar th:first-child{text-align:left}
.radar td:first-child{white-space:nowrap;color:var(--ink)}
.radar .m{display:block;font-size:11.5px;color:var(--mut)}
.c{display:inline-block;min-width:66px;padding:4px 6px;border-radius:6px;font-size:11.5px;font-weight:500;border:0;white-space:nowrap}
.c.link{outline:2px solid transparent;cursor:pointer}.c.link:hover{outline-color:var(--blue)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:flex-start}
.list .it:last-child{border-bottom:0}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:500}
.t{color:var(--ink);font-size:14px;font-weight:500}.d{color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.chip b{font-weight:500;color:var(--mut);margin-right:5px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:14px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 0;color:var(--mut);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;min-height:42px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.steps{display:flex;gap:6px}
.steps .s{flex:1;text-align:center;font-size:11.5px;color:#9aa0ad}
.steps .s i{display:block;height:6px;border-radius:3px;background:#E3E6EE;margin-bottom:6px}
.steps .s.done i{background:var(--ok)}.steps .s.done{color:var(--ink)}
.steps .s.cur i{background:var(--blue)}.steps .s.cur{color:var(--ink);font-weight:500}
.big{font-size:clamp(20px,2.2vw,26px);font-weight:500;color:var(--ink);white-space:nowrap}
.mini{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:8px;border-radius:5px;background:#EEF0F4;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
.ring-wrap{position:relative;width:220px;height:220px;flex:none;margin:auto}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.obl{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #F0F2F6;font-size:13.5px}
.obl .dot{width:9px;height:9px;border-radius:50%;flex:none}
.obl span:nth-child(2){flex:1;color:var(--ink)}.obl span:last-child{color:var(--mut);font-size:12.5px;white-space:nowrap}
.benford{display:flex;align-items:flex-end;gap:10px;height:210px;padding:0 4px;border-bottom:1px solid var(--line)}
.benford .col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;position:relative}
.benford .e{width:42%;background:#fff;border:1.5px solid #9aa6c8;border-bottom:0;border-radius:3px 3px 0 0}
.benford .a{width:42%;background:var(--blue);border-radius:3px 3px 0 0}
.benford .a.hot{background:var(--risk)}
.bx{display:flex;gap:10px;padding:6px 4px 0}.bx span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.tests .it{cursor:pointer;border-radius:8px;padding:10px 8px;margin:0 -8px;border-bottom:0}
.tests .it.on{background:var(--revl)}
.tests .it:hover{background:#F4F6FC}
.sev{margin-left:auto;text-align:right;white-space:nowrap}
.net{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.phone{width:min(360px,100%);height:740px;border-radius:46px;background:#0d0f14;padding:11px;box-shadow:0 26px 50px rgba(10,20,50,.25);margin:0 auto}
.scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ph-h{background:var(--navy);color:#fff;padding:16px 18px 18px}
.mc{background:#fff;border-radius:14px;margin:10px 12px 0;padding:13px;border:1px solid var(--line)}
.mc h4{font-size:11.5px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:0 0 6px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0F2F6}.mr:last-child{border-bottom:0}
.tb{margin-top:auto;height:58px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--mut)}
.toggle{width:40px;height:22px;border-radius:11px;background:#C3C8D3;border:0;position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--ok)}.toggle.on::after{left:21px}
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feed .it{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hl{outline:3px solid var(--gold)!important;outline-offset:4px;border-radius:12px;animation:pulse 1.6s ease 2}
@keyframes pulse{50%{outline-offset:8px}}
.tour{position:fixed;right:20px;bottom:44px;width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;box-shadow:0 20px 50px rgba(10,20,50,.25);padding:16px 18px;z-index:40;display:none}
.tour.on{display:block}
.tour .k{font-size:12px;color:#7a5c17;font-weight:500}
.tour h3{margin:4px 0 6px;font-size:17px;font-weight:500;color:var(--ink)}
.tour p{margin:0 0 12px;font-size:14px;color:var(--tx)}
.dots{display:flex;gap:4px;margin-right:auto;align-items:center}.dots i{width:6px;height:6px;border-radius:50%;background:#D5D9E2}.dots i.on{background:var(--gold)}
.veil{position:fixed;inset:0;background:rgba(14,22,48,.62);z-index:50;display:grid;place-items:center;padding:16px}
.welcome{background:#fff;border-radius:18px;max-width:560px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.welcome .hdr{background:var(--navy);color:#fff;padding:26px 28px;display:flex;gap:16px;align-items:center}
.welcome .bd{padding:22px 28px 26px}
.motto{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:19px;text-align:center;margin-top:18px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.foot{position:fixed;left:236px;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--line);font-size:12px;color:var(--mut);padding:7px 24px;z-index:4;display:flex;justify-content:space-between;gap:12px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#F4F6FA;border-radius:6px;padding:2px 6px;white-space:nowrap}
.draft{border-left:3px solid var(--gold);background:#FFFBF2;padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
.ask{flex:1;max-width:560px;position:relative;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 5px 0 12px;height:42px}
.ask:focus-within{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--bl)}
.ask input{border:0;background:none;outline:none;font:inherit;font-size:14.5px;flex:1;color:var(--ink);height:100%}
.ask .go{border:0;background:var(--blue);color:#fff;border-radius:7px;height:32px;padding:0 13px;font-size:13px;font-weight:500}
.sugg{position:absolute;top:48px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(10,20,50,.16);padding:6px;display:none;z-index:30}
.sugg.on{display:block}.sugg .h{font-size:11.5px;color:var(--mut);padding:6px 10px 4px}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px;min-height:40px;color:var(--ink)}
.sugg button:hover,.sugg button:focus{background:var(--bg);outline:none}
.role{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.role select{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);min-height:38px}
.modal.wide{max-width:720px;max-height:calc(100vh - 40px);overflow:auto}
.think{display:flex;flex-direction:column;gap:8px;margin:14px 0}.think div{font-size:13.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
.think i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}.think .dn i{animation:none;background:var(--ok)}
@keyframes blink{50%{opacity:.25}}
.ans{font-size:14.5px;color:var(--tx)}.ans p{margin:0 0 10px}.ans ul{margin:0 0 10px;padding-left:20px}.ans li{margin:5px 0}
.src{font-size:12px;color:var(--mut);margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:760px}
.cal .dh{font-size:11.5px;color:var(--mut);text-align:center;padding:4px 0}
.cal .dc{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:100px;padding:7px;display:flex;flex-direction:column;gap:4px}
.cal .dc.we{background:#FAFBFC}.cal .dc.mute{background:#F6F7F9}.cal .dc.mute .dn{color:#a3a8b5}
.cal .dc.today{border:2px solid var(--blue)}
.cal .dn{font-size:12.5px;font-weight:500;color:var(--ink);display:flex;justify-content:space-between}
.ev{font-size:11.5px;line-height:1.3;border-radius:6px;padding:4px 6px}
.nav button.lock{opacity:.5}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.meter{display:flex;align-items:center;gap:12px;padding:7px 0}.meter .nm{width:150px;font-size:13.5px;color:var(--ink)}.meter .bar{flex:1;height:10px}.meter .vl{width:76px;text-align:right;font-size:13.5px;font-weight:500;white-space:nowrap}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.agents{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2b{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:8px 10px;gap:8px}
.brand{padding:0 4px 0 0;flex:none}.brand .sub,.brand .wm{display:none}.nav{flex:1;flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}.nav .sec,.me{display:none}.nav button{white-space:nowrap;padding:8px 10px;flex:none;color:#e4e9f6}
.top{position:static;padding:0 14px}.top .date{display:none}.content{padding:16px 14px 110px}.foot{left:0;padding:7px 14px}}
@media(max-width:600px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}.ask{order:3;flex-basis:100%;max-width:none}.role span{display:none}.tourbtn{padding:6px 10px}.meter .nm{width:96px}.tour{bottom:36px;padding:12px 14px}.tour h3{font-size:15.5px}.tour p{font-size:13.5px;margin-bottom:8px}.steps .s:not(.cur){font-size:0}.scroll>table{min-width:600px}.radar{min-width:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.agents{grid-template-columns:minmax(0,1fr)}.search{display:none}.wm{font-size:14px}.foot span:last-child{display:none}.phone{height:680px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span id="logo"></span><div><div class="wm">ABACUS360</div><div class="sub">360 Practice</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="main">
    <header class="top"><div class="ask" id="ask"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8933E" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><input id="askIn" type="text" placeholder="Ask 360 anything about your firm" aria-label="Ask 360" autocomplete="off"><button class="go" id="askGo">Ask</button><div class="sugg" id="sugg"></div></div>
      <label class="role" id="roleBox"><span>View as</span><select id="roleSel"><option value="partner">Partner</option><option value="manager">Client manager</option><option value="secretary">Secretary</option><option value="trainee">Trainee</option></select></label>
      <div class="r"><span class="date">Monday 14 December 2026</span><button class="tourbtn" id="tourStart">Guided tour</button></div></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="foot"><span>Demonstration with sample data · prepared for ABACUS360 by MIA Technology · confidential</span><span>No real client data is used</span></div>
<div class="tour" id="tour" role="dialog" aria-live="polite"></div>
<div id="layer"></div>

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K = n => 'K' + n.toLocaleString('en-US', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
const K2 = n => 'K' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

function ring(size, colors, rd) {
  const c = size / 2, R = c - rd - 2, n = colors.length;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">` + colors.map((col, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * i / n;
    return `<circle cx="${(c + R * Math.cos(a)).toFixed(1)}" cy="${(c + R * Math.sin(a)).toFixed(1)}" r="${rd}" fill="${col}"/>`;
  }).join('') + '</svg>';
}
function logo(size) {
  const c = size / 2, R = c - 3.4; let s = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + 2 * Math.PI * i / 10; s += `<circle cx="${(c + R * Math.cos(a)).toFixed(1)}" cy="${(c + R * Math.sin(a)).toFixed(1)}" r="${(1.2 + 1.7 * i / 9).toFixed(2)}" fill="#fff" opacity="${(0.55 + 0.45 * i / 9).toFixed(2)}"/>`; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${s}</svg>`;
}

  if (t.dataset.sign) { S.signed[t.dataset.sign] = true; render(); toast('Signed off as mentor: ' + t.dataset.sign); return; }
  if (t.dataset.agent) { if (S.paused) { toast('All agents are paused. Resume them first.'); return; } S.agents[t.dataset.agent] = !S.agents[t.dataset.agent]; render(); toast(t.dataset.agent + (S.agents[t.dataset.agent] ? ' is on' : ' is off')); return; }
  if (t.dataset.coc) { const ev = EVIDENCE.find(x => x[0] === t.dataset.coc); modal(`<h2 style="font-size:18px">Chain of custody · ${ev[0]}</h2><div class="d" style="margin-bottom:10px">${ev[1]}</div><div class="list">${[[ev[4] + ' 09:12', 'Received from ' + ev[3] + ' · hashed ' + ev[5]], [ev[4] + ' 09:14', 'Stored read-only · copy for analysis made'], [ev[4] + ' 09:20', 'Working copy opened for analysis · hash re-checked'], ['14 Dec 08:40', 'Viewed by J. M. Liswaniso']].map(r => `<div class="it"><div class="ic ok" style="font-size:11px">✓</div><div><div class="t">${r[0]}</div><div class="d">${r[1]}</div></div></div>`).join('')}</div><div class="btns" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-close>Close</button></div>`); return; }
  switch (t.id) {
    case 'ask-btn': modal(`<h2 style="font-size:18px">Request drafted by Front Desk</h2><div class="d" style="margin-bottom:12px">To Lusaka Packaging Co. and Zed Fuel Station, on WhatsApp, from ABACUS360's number</div><div class="draft">Good morning. On behalf of our client Kalimba Foods Ltd, may we ask you to issue invoices INV-2291 and 88713 through ZRA Smart Invoice? Without a Smart Invoice our client cannot claim the VAT. Thank you, ABACUS360.</div><div class="d" style="margin-top:10px">Nothing is sent until a person approves it.</div><div class="btns" style="margin-top:14px;justify-content:flex-end"><button class="btn o" data-close>Cancel</button><button class="btn" id="send-ask">Approve and send</button></div>`); break;
    case 'send-ask': S.asked = true; closeModal(); render(); toast('Sent to both suppliers. The client was told in My 360.'); break;
    case 'signoff-btn': S.stage = 6; render(); toast('Review signed off. Sent to the client for approval in My 360.'); break;
    case 'approve-btn': S.approved = true; render(); toast('Approved and e-signed by the client. Your team can now file.'); break;
    case 'file-btn': modal(`<h2 style="font-size:18px">Assisted filing · ZRA TaxOnline</h2><div class="list"><div class="it"><div class="ic ok">1</div><div><div class="t">Return file prepared in ZRA's upload format</div></div></div><div class="it"><div class="ic ok">2</div><div><div class="t">TaxOnline opened with the client's credentials from the vault</div><div class="d">Access recorded · approved by the client in writing</div></div></div><div class="it"><div class="ic rev">3</div><div><div class="t">A person checks and presses Submit</div><div class="d">The acknowledgement and payment reference are captured automatically</div></div></div></div><div class="btns" style="margin-top:14px;justify-content:flex-end"><button class="btn o" data-close>Cancel</button><button class="btn" id="do-file">Submit as C. Mulenga</button></div>`); break;
    case 'do-file': S.stage = 7; S.prn = '1100 2612 4471 0098'; closeModal(); render(); toast('Filed. Acknowledgement and payment reference saved to the file.'); break;
    case 'paid-btn': S.stage = 8; S.paid = true; render(); toast('Payment proof uploaded by the client. Job closed with evidence.'); break;
    case 'pause-btn': S.paused = !S.paused; render(); toast(S.paused ? 'All agents paused. Nothing runs until a partner resumes them.' : 'Agents resumed at their approved levels.'); break;
    case 'addf': if (!S.findings.includes(S.test)) S.findings.push(S.test); render(); toast('Added to the expert report, section 4'); break;
    case 'draft-btn': $('#draft-out').innerHTML = `<div class="draft"><b style="font-weight:500">Draft · for the examiner's review</b><br>${S.findings.length ? '' : 'No findings added yet, so the draft uses the high-risk results. '}Between March 2025 and January 2026, Zed Star Supplies, Copperway Trading and Kafue Allied Traders received K2,876,300. Each shares a bank account, a telephone number or a residential address with one of two employees in procurement and stores (EV-001, EV-003, EV-004). Ten of these payments were split into amounts just below the K50,000 approval limit. The examiner should confirm each match against the original bank mandates before drawing a conclusion.</div>`; break;
    case 'tourStart': startTour(); break;
    case 'askGo': { const v = $('#askIn').value.trim(); if (v) runAsk(matchQ(v), v); else $('#sugg').classList.toggle('on'); break; }
    case 'audit-sign': modal(`<h2 style="font-size:18px">Sign the audit report</h2><div class="d" style="margin:6px 0 12px">Copperline Engineering Ltd · year ended 30 June 2026</div><div class="list"><div class="it"><div class="ic rev">1</div><div><div class="t">You sign as J. M. Liswaniso, FZICA, engagement partner</div><div class="d">Unmodified opinion</div></div></div><div class="it"><div class="ic rev">2</div><div><div class="t">The report, the statements and the work papers are locked</div></div></div><div class="it"><div class="ic rev">3</div><div><div class="t">A verification code goes on the report as a QR code</div></div></div></div><div class="btns" style="margin-top:14px;justify-content:flex-end"><button class="btn o" data-close>Cancel</button><button class="btn gd" id="do-audit-sign">Sign</button></div>`); break;
    case 'do-audit-sign': S.auditSigned = true; closeModal(); render(); toast('Signed. File locked and verification code A360-FS-26-0431 issued.'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#sugg').classList.remove('on'); } if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.test) { e.preventDefault(); e.target.click(); } });

$('#askIn').addEventListener('focus', () => { $('#sugg').innerHTML = suggHTML(); $('#sugg').classList.add('on'); });
$('#askIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) runAsk(matchQ(v), v); } });
document.addEventListener('click', e => { if (!e.target.closest('#ask')) $('#sugg').classList.remove('on'); });
$('#roleSel').addEventListener('change', e => { S.role = e.target.value; render(); toast('Now viewing as ' + ROLES[S.role].label + ': ' + ROLES[S.role].who); });

/* live agent feed */
let fi = 0;
const ticker = setInterval(() => {
  if (S.paused) return;
  const [a, d] = FEED_POOL[fi++ % FEED_POOL.length];
  if (!S.agents[a]) return;
  feed.push([String(9 + Math.floor(fi / 4)).padStart(2, '0') + ':' + String((fi * 7) % 60).padStart(2, '0'), a, d]);
  const f = $('#feed'); if (f) f.innerHTML = feedHTML();
}, 7000);

/* ------------------------------------------------------------ guided tour */
const TOUR = [
  ['today', '#kpis', 'Your firm this morning', 'The partner\'s view: what was filed on time, what is due, what waits on clients, and the money at risk. Five numbers, no Monday meeting.'],
  ['today', '#ask', 'Ask 360, in plain English', 'Ask the firm a question the way you would ask a senior manager. Try "Which clients could miss a deadline this week?" Every answer shows where its numbers come from.'],
  ['today', '#radar', 'Compliance radar', 'Every client against every obligation, sorted by risk. Press Kalimba Foods\' blue VAT cell to open the job behind it.'],
  ['calendar', '#cal', 'The statutory calendar, worked for you', 'Every ZRA, NAPSA, NHIMA and PACRA date for every client. Ten days before each deadline the jobs open themselves, so nothing starts late.'],
  ['clients', '#ring', 'Every client, seen from 360°', 'The ring is the client\'s year. Each bead is an obligation: green filed, blue in review, amber waiting on the client.'],
  ['job', '#si-card', 'A guard on every VAT claim', 'Since January 2025 input VAT is claimed only on Smart Invoice invoices. The system checks every purchase and flags the gaps. Try "Ask suppliers".'],
  ['job', '#signoff', 'Three degrees of review', 'Preparer, reviewer, client. Press "Sign off review" at the top, and the job moves to the client.'],
  ['client-app', '#phone', 'The client approves from her phone', 'This is My 360. Press Approve, then go back to the VAT job and file it: a person submits, and the payment reference is saved.'],
  ['audit', '#wp', 'Audit files, ready for your signature', 'Materiality, work papers, review notes and misstatements in one file. When every section is reviewed, the partner signs, the file locks and a verification code goes on the report.'],
  ['forensic', '#benford', 'Forensic work, built in', 'A case workspace for your investigations. Benford\'s first-digit test on 18,432 payments shows a spike just below the K50,000 approval limit.'],
  ['forensic', '#network', 'Related parties, drawn for you', 'Two employees share a bank account, a phone number and an address with three vendors.'],
  ['forensic', '#evidence', 'Evidence that stands up', 'Every item is hashed on receipt and every access is logged. Press Custody on any line to see its chain of custody.'],
  ['training', '#mentor', 'Your trainees, mentored on real work', 'Practical experience logged from real jobs, waiting for your sign-off as their mentor.'],
  ['insights', '#lines', 'The partner\'s view of the business', 'Fees by service line, unbilled work, debtors, team capacity and the fixed fees that cost more than they pay. Partners only.'],
  ['agents', '#agents-grid', 'Nine agents do the groundwork', 'Each has one job, its own level and its own log. One button pauses them all.'],
  ['today', '#roleBox', 'Everyone sees their own 360', 'Partner, client manager, secretary, trainee: each sees their own day, and only what their role allows. Switch the view and see.'],
  ['', '', 'See it live, in your office', 'This was a demonstration with sample data. The real system is built around ABACUS360: your clients, your team, your workflow.']
];
function startTour() { S.role = 'partner'; $('#roleSel').value = 'partner'; S.tourI = 0; showStep(); }
function showStep() {
  const [r, sel, h, p] = TOUR[S.tourI];
  if (r === 'forensic') { S.ftab = sel === '#network' ? 'network' : sel === '#evidence' ? 'evidence' : 'analytics'; if (sel === '#benford') S.test = 'benford'; }
  if (r === 'clients') S.ctab = 'overview';
  if (r && route() !== r) location.hash = r; else render();
  const last = S.tourI === TOUR.length - 1;
  const el = $('#tour'); el.classList.add('on');
  el.innerHTML = `<div class="k">Guided tour · ${S.tourI + 1} of ${TOUR.length}</div><h3>${h}</h3><p>${p}</p>
    ${last ? `<div class="btns" style="margin-bottom:12px"><a class="btn gd" href="https://wa.me/972509591299?text=${encodeURIComponent('Hello Moshe, I have seen the demo. Let us meet when I am back.')}" target="_blank" rel="noopener">Book the live session on WhatsApp</a></div><p class="d" style="margin-top:-4px">Moshe Israel Ashtamkar · WhatsApp +972 50 959 1299</p>` : ''}
    <div style="display:flex;align-items:center;gap:8px"><div class="dots">${TOUR.map((_, i) => `<i class="${i === S.tourI ? 'on' : ''}"></i>`).join('')}</div>
    ${S.tourI > 0 ? '<button class="btn o" id="tprev" style="min-height:36px;padding:6px 12px">Back</button>' : ''}<button class="btn ${last ? 'o' : ''}" id="tnext" style="min-height:36px;padding:6px 12px">${last ? 'Close' : 'Next'}</button></div>`;
  $('#tnext').onclick = () => { if (last) endTour(); else { S.tourI++; showStep(); } };
  const pv = $('#tprev'); if (pv) pv.onclick = () => { S.tourI--; showStep(); };
  setTimeout(highlight, 60);
}
function highlight() {
  document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  if (S.tourI < 0) return;
  const sel = TOUR[S.tourI][1]; if (!sel) return;
  const el = $(sel); if (el) { el.classList.add('hl'); el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: innerWidth < 600 ? 'start' : 'center' }); }
}
function endTour() { S.tourI = -1; $('#tour').classList.remove('on'); highlight(); }

/* ------------------------------------------------------------ welcome */
function welcome() {
  $('#layer').innerHTML = `<div class="veil" id="veil"><div class="welcome"><div class="hdr">${logo(44)}<div><div style="letter-spacing:3px;font-weight:300;font-size:20px">ABACUS360</div><div style="font-size:12px;letter-spacing:1.6px;color:#9fb0dc;text-transform:uppercase">360 Practice · demonstration</div></div></div>
    <div class="bd"><div style="font-size:22px;color:var(--ink);font-weight:500;line-height:1.25">${hello()}, Mr Liswaniso</div>
    <p style="margin:10px 0 0">This is a working demonstration of the system we would build for ABACUS360, with a sample firm and sample clients. Click anything. Nothing you do here leaves this page.</p>
    <p class="d" style="margin:8px 0 18px">Prepared for J. M. Liswaniso, FZICA · by MIA Technology</p>
    <div class="btns"><button class="btn gd" id="w-tour">Take the guided tour · 8 minutes</button><button class="btn o" id="w-free">Explore on my own</button></div>
    <div class="motto">Built on the level. Checked on the square.</div></div></div></div>`;
  $('#w-tour').onclick = () => { closeModal(); startTour(); };
  $('#w-free').onclick = closeModal;
}

render();
welcome();
}
</script>
</body>
